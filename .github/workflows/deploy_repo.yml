name: deploy repo

# mpmのプラグインカタログ（静的ファイル）をCloudflare Workers Assetsへデプロイする。
#
# 子リポジトリ（children.json）の中身はクライアント（mpm）が直接たどるため、
# このワークフローは repo/ 配下の変更時にだけ動けばよい。
on:
  push:
    branches:
      - main
    paths:
      - "repo/**"
      - ".github/workflows/deploy_repo.yml"
  workflow_dispatch:

permissions:
  contents: read

# デプロイの同時実行を防ぐ（後発が先発を追い越して古い内容を配信しないように）
concurrency:
  group: deploy-repo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # mpm はルートに package.json を持たないため、pnpm のバージョンを読む
      # package.json を明示する（repo/package.json の packageManager を参照させる）
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
          package_json_file: repo/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./repo/pnpm-lock.yaml

      - name: Install
        working-directory: repo
        run: pnpm install --frozen-lockfile

      # plugins/*.json と children.json を検証し、index.json と JSON Schema を生成する。
      # 検証に失敗した場合はここで止まり、壊れたカタログは配信されない。
      - name: Build catalog
        working-directory: repo
        run: pnpm run build

      # デプロイ用の認証情報は GitHub Actions のリポジトリシークレットから取得する
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: repo
          command: deploy
