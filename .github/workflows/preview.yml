name: preview.yml
on:
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

env:
  PROJECT_NAME: mpm

jobs:
  # Gradle ビルド (JAR + テスト + detekt)
  build-jar:
    runs-on: ubuntu-latest
    # actions/attest-build-provenance専用の権限をこのjobに限定する（最小権限の原則）
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      commit_sha: ${{ steps.vars.outputs.sha }}
      test_total: ${{ steps.publish-test-results.outputs.total }}
      test_passed: ${{ steps.publish-test-results.outputs.passed }}
      test_skipped: ${{ steps.publish-test-results.outputs.skipped }}
      test_failed: ${{ steps.publish-test-results.outputs.failed }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "sha=$calculatedSha" >> $GITHUB_OUTPUT

      # プレビュービルドには tag が無いため、短縮SHAをバージョンとして使う。
      # 以前は $GITHUB_ENV（ファイルパス）を参照したうえ、シングルクォートで
      # 変数展開もされておらず、置換結果が literal な "$after" になっていた。
      - name: Change plugin.yml version
        env:
          PREVIEW_VERSION: ${{ steps.vars.outputs.sha }}
        run: |
          sed -i "s/VersionPlaceholder/${PREVIEW_VERSION}/g" ./gradle.properties
          grep -q "^version=${PREVIEW_VERSION}$" ./gradle.properties

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: ./gradlew build

      # Attestationは実際に配布されるファイル名を署名対象にする必要があるため、
      # attest/upload工程より前にビルド成果物を最終的なファイル名へリネームしておく
      - name: Rename JAR artifacts
        if: steps.build.outcome == 'success'
        run: |
          mv paper/build/libs/paper-*-all.jar paper/build/libs/${{ env.PROJECT_NAME }}-paper-${{ steps.vars.outputs.sha }}.jar
          mv velocity/build/libs/velocity-*-all.jar velocity/build/libs/${{ env.PROJECT_NAME }}-velocity-${{ steps.vars.outputs.sha }}.jar
          mv api/build/libs/api-*.jar api/build/libs/${{ env.PROJECT_NAME }}-api-${{ steps.vars.outputs.sha }}.jar

      - name: Install Allure CLI
        if: success() || failure()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz
          echo "$PWD/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Aggregate Allure results
        if: success() || failure()
        run: |
          mkdir -p ./build/allure-results-aggregated
          # 各モジュールの allure-results を1箇所へ集約する。
          # 新しいモジュールにテストを追加してもここを編集せずレポートへ自動的に含まれる。
          find . -type d -path '*/build/allure-results' -not -path '*/allure-results-aggregated/*' | while read -r dir; do
            cp -a "$dir/." ./build/allure-results-aggregated/ 2>/dev/null || true
          done

      - name: Generate Allure report
        if: success() || failure()
        continue-on-error: true
        run: allure generate ./build/allure-results-aggregated -o ./build/allure-report --clean

      - name: Publish test results
        id: publish-test-results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure()
        with:
          report_paths: './**/build/test-results/test/TEST-*.xml'

      # GitHub Attestations で署名（SLSA build provenance）
      # Build with GradleがJAR生成前に失敗した場合はsubject-pathが空になりこのstep自体が失敗するため、
      # continue-on-errorで握りつぶされた実際のビルド結果(steps.build.outcome)で明示的にガードする
      - name: Attest JAR artifacts
        id: attest
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            paper/build/libs/${{ env.PROJECT_NAME }}-paper-${{ steps.vars.outputs.sha }}.jar
            velocity/build/libs/${{ env.PROJECT_NAME }}-velocity-${{ steps.vars.outputs.sha }}.jar
            api/build/libs/${{ env.PROJECT_NAME }}-api-${{ steps.vars.outputs.sha }}.jar

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jar-artifacts
          retention-days: 1
          path: |
            paper/build/libs/${{ env.PROJECT_NAME }}-paper-${{ steps.vars.outputs.sha }}.jar
            velocity/build/libs/${{ env.PROJECT_NAME }}-velocity-${{ steps.vars.outputs.sha }}.jar
            api/build/libs/${{ env.PROJECT_NAME }}-api-${{ steps.vars.outputs.sha }}.jar
            common/build/reports/tests/test/
            paper/build/reports/tests/test/
            velocity/build/reports/tests/test/
            build/reports/detekt/
            build/allure-report/

  # Dokka ドキュメント生成
  build-dokka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Generate Dokka API documentation
        run: ./gradlew dokkaGenerate

      - name: Upload Dokka artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dokka-artifacts
          retention-days: 1
          path: docs/public/dokka/

  # Docs ビルド
  build-docs:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.0.0
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "sha=$calculatedSha" >> $GITHUB_OUTPUT

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm i --frozen-lockfile

      # サイドバーの Kotlin アイコンから Dokka に遷移できるよう、docs ビルド前に
      # docs/public/dokka へ Dokka を生成しておく（pnpm build が public/ を同梱する）
      - name: Generate Dokka into docs/public/dokka
        run: ./gradlew dokkaGenerate

      - name: Build docs
        working-directory: docs
        env:
          BASE_PATH: /mpm/${{ steps.vars.outputs.sha }}/docs
          NEXT_PUBLIC_BASE_PATH: /mpm/${{ steps.vars.outputs.sha }}/docs
        run: pnpm run build

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-artifacts
          retention-days: 1
          path: docs/out/

  # S3 アップロード & PRコメント
  upload:
    needs: [build-jar, build-dokka, build-docs]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: true
      AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
      AWS_CLI_FILE_ENCODING: UTF-8
      AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
      S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
      S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
      S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
      COMMIT_SHORT_SHA: ${{ needs.build-jar.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare upload directory
        run: |
          mkdir -p ./upload/jars
          mkdir -p ./upload/junit
          mkdir -p ./upload/detekt
          mkdir -p ./upload/docs
          mkdir -p ./upload/dokka
          mkdir -p ./upload/allure

          # JAR artifacts（build-jarジョブで既にAttestation対象のファイル名へリネーム済みのため、そのまま配置する）
          mv artifacts/jar-artifacts/paper/build/libs/${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar ./upload/jars/ || true
          mv artifacts/jar-artifacts/velocity/build/libs/${{ env.PROJECT_NAME }}-velocity-${{ env.COMMIT_SHORT_SHA }}.jar ./upload/jars/ || true
          mv artifacts/jar-artifacts/api/build/libs/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar ./upload/jars/ || true
          # JUnit HTML レポートはモジュールごとに生成されるため、junit/<module>/ に配置し、
          # 各モジュールへのリンクを持つ junit/index.html を生成する（PR コメントのリンク先を維持するため）
          for module in common paper velocity; do
            if [ -d "artifacts/jar-artifacts/$module/build/reports/tests/test" ]; then
              mkdir -p "./upload/junit/$module"
              cp -r "artifacts/jar-artifacts/$module/build/reports/tests/test/." "./upload/junit/$module/"
            fi
          done
          {
            echo '<!doctype html><html><head><meta charset="utf-8"><title>JUnit reports</title></head><body>'
            echo '<h1>JUnit reports</h1><ul>'
            for dir in ./upload/junit/*/; do
              [ -d "$dir" ] || continue
              module=$(basename "$dir")
              echo "<li><a href=\"$module/index.html\">$module</a></li>"
            done
            echo '</ul></body></html>'
          } > ./upload/junit/index.html
          cp -r artifacts/jar-artifacts/build/reports/detekt/* ./upload/detekt/ || true
          cp -r artifacts/jar-artifacts/build/allure-report/* ./upload/allure/ || true

          # Dokka artifacts
          cp -r artifacts/dokka-artifacts/* ./upload/dokka/ || true

          # Docs artifacts
          cp -r artifacts/docs-artifacts/* ./upload/docs/

      # rclone の最新リリースを入れる (apt の 1.60 は R2 への転送で NotImplemented が多発する)。
      # 取得したバイナリは actions のキャッシュに保存され、アクション自体の更新は Dependabot が行う
      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      # aws s3 cp はファイルごとの処理が遅く、--only-show-errors では進捗も出ないため rclone で送る。
      # rclone は単一プロセスで接続を再利用しながら高い並列数で転送し、5 秒ごとに進捗をログに出す
      - name: Upload to S3
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ env.AWS_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
        run: |
          # secret が空のまま進むと、誤ったキーにアップロードしたり PR コメントの URL が壊れたりするため止める
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (check the MORINOPARTY_CI_* organization secrets)"
              exit 1
            fi
          done

          # xargs から起動する sh でも参照できるよう export する
          export PREFIX="${PROJECT_NAME}/${COMMIT_SHORT_SHA}"

          # JAR・Docs・Dokka・レポートをまとめて 1 プロセスで送る
          rclone copy ./upload "s3:${S3_UPLOAD_BUCKET}/${PREFIX}" \
            --transfers=32 --checkers=32 --stats=5s --stats-one-line -v

          # 公開ドメインはディレクトリの URL から index.html を自動で解決しない。
          # docs のリンクは末尾スラッシュ (trailingSlash: true) なので、各 index.html を
          # 末尾スラッシュのキーとしても置き、リンク先や直接開いた URL が 404 にならないようにする
          find ./upload/docs -name index.html -print0 \
            | xargs -0 -P 16 -I {} sh -c '
                relative="${1#./upload/docs/}"
                aws s3api put-object \
                  --bucket "$S3_UPLOAD_BUCKET" \
                  --key "$PREFIX/docs/${relative%index.html}" \
                  --body "$1" \
                  --content-type "text/html; charset=utf-8" \
                  --endpoint-url "$S3_ENDPOINT" > /dev/null
              ' _ {}

          echo "S3 upload completed"

      - name: Get limit time
        id: limit-time
        run: |
          limit_time=$(date -d "7 days" +%Y-%m-%d)
          echo "LIMIT_TIME=$limit_time" >> $GITHUB_ENV

      - name: Create comment file
        env:
          ARTIFACT_NAME: "${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar"
          ARTIFACT_NAME_VELOCITY: "${{ env.PROJECT_NAME }}-velocity-${{ env.COMMIT_SHORT_SHA }}.jar"
          ARTIFACT_NAME_API: "${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar"
          ARTIFACT_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/jars/${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar"
          ARTIFACT_URL_VELOCITY: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/jars/${{ env.PROJECT_NAME }}-velocity-${{ env.COMMIT_SHORT_SHA }}.jar"
          ARTIFACT_URL_API: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/jars/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar"
          JUNIT_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/junit/index.html"
          ALLURE_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/allure/index.html"
          DETEKT_REPORT_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/detekt/detekt.html"
          DOCS_PREVIEW_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/docs/index.html"
          DOKKA_URL: "${{ env.S3_PUBLIC_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/dokka/index.html"
          ATTESTATION_URL: "${{ needs.build-jar.outputs.attestation_url }}"
          TEST_TOTAL: "${{ needs.build-jar.outputs.test_total }}"
          TEST_PASSED: "${{ needs.build-jar.outputs.test_passed }}"
          TEST_SKIPPED: "${{ needs.build-jar.outputs.test_skipped }}"
          TEST_FAILED: "${{ needs.build-jar.outputs.test_failed }}"
          LIMIT_TIME: ${{ env.LIMIT_TIME }}
        run: |
          cat  << EOF > comment.md
          ## 🚀 Preview of ${{ github.event.repository.name }}

          ### 📦 Preview JARs
          | Artifact | Download |
          |----------|----------|
          | Bukkit (Paper) | [$ARTIFACT_NAME]($ARTIFACT_URL) |
          | Velocity | [$ARTIFACT_NAME_VELOCITY]($ARTIFACT_URL_VELOCITY) |
          | API | [$ARTIFACT_NAME_API]($ARTIFACT_URL_API) |

          > 📜 **Attestation** (SLSA provenance): [Verify on GitHub]($ATTESTATION_URL) or run \`gh attestation verify <jar-file> --owner morinoparty\`

          ### 📖 Documentation & Reports
          Available for 7 days (until $LIMIT_TIME)
          | Resource | Link |
          |----------|------|
          | 📖 Documentation | [Preview]($DOCS_PREVIEW_URL) |
          | 📖 Dokka API | [Preview]($DOKKA_URL) |
          | 🧪 Allure Report | [Report]($ALLURE_REPORT_URL) |
          | 🧪 JUnit Report | [Report]($JUNIT_REPORT_URL) |
          | 🔍 Detekt Report | [Report]($DETEKT_REPORT_URL) |

          ### 🧪 Test Summary
          | Tests | Passed | Skipped | Failed |
          |-------|--------|---------|--------|
          | $TEST_TOTAL | $TEST_PASSED ✅ | $TEST_SKIPPED ⏭️ | $TEST_FAILED ❌ |
          EOF

      - name: Create PR comment
        if: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') }}
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
