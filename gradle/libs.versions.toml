[versions]
lamp = "4.0.0-rc.18"
paper = "26.2.build.129-stable"
# Velocity API（プロキシ版mpm向け）
velocity = "4.2.0"
# Paper / Velocity の双方が同梱する Adventure と SLF4J（common は compileOnly で参照する）
adventure = "5.2.0"
slf4j = "2.0.19"
# run-paper / run-velocity は同じ run-task ファミリーのため版を揃える
runTask = "3.1.0"
mccoroutine = "2.23.0"
koin = "4.2.2"
coroutine = "1.11.0"
serialization = "1.11.0"
reflect = "2.4.21"
ktor = "3.6.0"
junit = "6.1.3"
mockBukkit = "3.93.2"
commonsIo = "2.22.0"
mockk = "1.14.11"
kaml = "0.77.1"
ktlint = "14.2.0"
arrow = "2.2.3"
cronUtils = "9.2.1"
allure = "2.35.5"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

lamp-common = { group = "io.github.revxrsal", name = "lamp.common", version.ref = "lamp" }
lamp-bukkit = { group = "io.github.revxrsal", name = "lamp.bukkit", version.ref = "lamp" }
lamp-brigadier = { group = "io.github.revxrsal", name = "lamp.brigadier", version.ref = "lamp" }
lamp-velocity = { group = "io.github.revxrsal", name = "lamp.velocity", version.ref = "lamp" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }

kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "reflect" }

mccoroutine-bukkit-api = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-api", version.ref = "mccoroutine" }
mccoroutine-bukkit-core = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-core", version.ref = "mccoroutine" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
mineauth-api = { group = "party.morino", name = "mineauth-api", version = "0.5.1" }

commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsIo" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version = "2.7" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutine" }

mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mock-bukkit = { group = "com.github.seeseemelk", name = "MockBukkit-v1.20", version.ref = "mockBukkit" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

# Allureレポート用（JUnit5の実行結果をallure-resultsとして出力する）
allure-junit5 = { group = "io.qameta.allure", name = "allure-junit5", version.ref = "allure" }

koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit5 = { group = "io.insert-koin", name = "koin-test-junit5", version.ref = "koin" }

arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }

cron-utils = { group = "com.cronutils", name = "cron-utils", version.ref = "cronUtils" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runTask" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "runTask" }
resource-factory = { id = "xyz.jpenilla.resource-factory", version = "1.4.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.20" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.20" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }


[bundles]
commands = ["lamp-common", "lamp-bukkit", "lamp-brigadier"]
commands-velocity = ["lamp-common", "lamp-velocity", "lamp-brigadier"]
coroutines = ["mccoroutine-bukkit-api", "mccoroutine-bukkit-core" , "kotlinx-coroutines-core"]
ktor-client = ["ktor-client-core", "ktor-client-cio", "ktor-client-mock", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
junit = ["junit-jupiter", "junit-platform-launcher", "kotlinx-coroutines-test", "mockk", "mock-bukkit"]
# MockBukkit を含まないテスト依存（プラットフォーム非依存の common モジュール向け）
junit-common = ["junit-jupiter", "junit-platform-launcher", "kotlinx-coroutines-test", "mockk"]
# common が compileOnly で参照する Adventure（実行時は各プラットフォームが提供する）
adventure = ["adventure-api", "adventure-text-minimessage", "adventure-text-serializer-plain"]
koin-test = ["koin-test", "koin-test-junit5"]
